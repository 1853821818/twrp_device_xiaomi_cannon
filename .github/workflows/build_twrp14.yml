name: Build TWRP 14 for Redmi Note 9 5G (cannon)

permissions: write-all

on:
  workflow_dispatch:
    inputs:
      manifest_branch:
        description: 'TWRP Manifest Branch'
        required: true
        default: 'twrp-14'
      device:
        description: 'Device Codename'
        required: true
        default: 'cannon'

env:
  MANIFEST_BRANCH: ${{ github.event.inputs.manifest_branch || 'twrp-14' }}
  DEVICE: ${{ github.event.inputs.device || 'cannon' }}
  OEM: xiaomi
  TWRP_DEVICE: twrp_cannon

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 240

    steps:
      - name: Checkout device tree
        uses: actions/checkout@v4
        with:
          path: device/xiaomi/cannon
          persist-credentials: true
          fetch-depth: 0

      - name: Prepare build environment
        run: |
          echo "=== Installing dependencies ==="
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            git-core gnupg flex bison build-essential zip curl zlib1g-dev \
            gcc-multilib g++-multilib libc6-dev-i386 lib32ncurses5-dev \
            x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev \
            libxml2-utils xsltproc unzip fontconfig python3 python3-pip \
            libncurses5 libssl-dev libelf-dev bc cpio rsync
          echo "=== Dependencies installed ==="

      - name: Install repo tool
        run: |
          mkdir -p ~/bin
          curl -sL https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git config --global color.ui false

      - name: Initialize TWRP manifest
        run: |
          export PATH=~/bin:$PATH
          mkdir -p ~/twrp
          cd ~/twrp
          echo "=== Initializing repo with branch: twrp-14 ==="
          repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b twrp-14
          echo "=== Repo initialized ==="

      - name: Sync TWRP source
        run: |
          export PATH=~/bin:$PATH
          cd ~/twrp
          echo "=== Syncing source ==="
          repo sync -j$(nproc --all) --force-sync --no-clone-bundle --no-tags
          echo "=== Source synced ==="

      - name: Copy device tree
        run: |
          echo "=== Copying device tree ==="
          mkdir -p ~/twrp/device/xiaomi
          cp -r $GITHUB_WORKSPACE/device/xiaomi/cannon ~/twrp/device/xiaomi/
          ls -la ~/twrp/device/xiaomi/cannon/
          echo "=== Check AndroidProducts.mk ==="
          cat ~/twrp/device/xiaomi/cannon/AndroidProducts.mk
          echo "=== Check twrp_cannon.mk ==="
          cat ~/twrp/device/xiaomi/cannon/twrp_cannon.mk
          echo "=== Device tree copied ==="

      - name: Build TWRP
        run: |
          export PATH=~/bin:$PATH
          export ALLOW_MISSING_DEPENDENCIES=true
          cd ~/twrp
          {
            echo "=== Setting up build environment ==="
            source build/envsetup.sh
            echo "=== Lunching: $TWRP_DEVICE-eng ==="
            lunch $TWRP_DEVICE-eng
            echo "=== Building recoveryimage ==="
            mka recoveryimage -j$(nproc --all)
            echo "=== Build complete ==="
          } 2>&1 | tee ~/twrp/build_full.log
          echo "=== Build exit code: ${PIPESTATUS[0]} ==="
          echo "=== Listing out directory ==="
          find ~/twrp/out/target/product/$DEVICE/ -name "*.img" -type f 2>/dev/null | head -50
          echo "=== Listing all files in out/target/product ==="
          ls -laR ~/twrp/out/target/product/$DEVICE/ 2>/dev/null | head -200
          echo "=== Saving error summary ==="
          grep -i -E "error:|failed|fatal:|missing|cannot|no such|ninja: build stopped" ~/twrp/build_full.log | tail -50 > ~/twrp/build_errors.log || true
          cat ~/twrp/build_errors.log
          echo "=== Output errors as annotations ==="
          while IFS= read -r line; do
            echo "::error::${line}"
          done < ~/twrp/build_errors.log
          echo "=== Output out files as annotations ==="
          find ~/twrp/out/target/product/$DEVICE/ -type f 2>/dev/null | while IFS= read -r line; do
            echo "::notice::${line}"
          done
      - name: Check build output
        run: |
          echo "=== Checking build output ==="
          ls -la ~/twrp/out/target/product/$DEVICE/
          if [ -f ~/twrp/out/target/product/$DEVICE/recovery.img ]; then
            echo "=== recovery.img found ==="
            file ~/twrp/out/target/product/$DEVICE/recovery.img
            ls -lh ~/twrp/out/target/product/$DEVICE/recovery.img
          else
            echo "=== recovery.img NOT found, listing all img files ==="
            find ~/twrp/out/target/product/$DEVICE/ -name "*.img" -type f
            exit 1
          fi

      - name: Upload recovery image
        uses: actions/upload-artifact@v4
        with:
          name: twrp-${{ env.DEVICE }}-${{ env.MANIFEST_BRANCH }}
          path: ~/twrp/out/target/product/${{ env.DEVICE }}/recovery.img
          retention-days: 30

      - name: Upload debug files
        uses: actions/upload-artifact@v4
        with:
          name: debug-files-${{ env.DEVICE }}
          path: |
            ~/twrp/out/recovery_Android.mk
            ~/twrp/out/product_packages.txt
            ~/twrp/out/recovery_binaries.txt
          retention-days: 7

      - name: Save build info
        if: always()
        run: |
          echo "=== Saving build info ==="
          cd $GITHUB_WORKSPACE/device/xiaomi/cannon
          cp ~/twrp/build_full.log build_full.log 2>/dev/null || echo "No build_full.log"
          cp ~/twrp/build_errors.log build_errors.log 2>/dev/null || echo "No build_errors.log"
          find ~/twrp/out/target/product/$DEVICE/ -type f 2>/dev/null > out_files.txt || true
          ls -laR ~/twrp/out/target/product/$DEVICE/ 2>/dev/null > out_dir.txt || true
          echo "=== out_files.txt content ==="
          cat out_files.txt 2>/dev/null | head -50 || echo "No out_files.txt"
          echo "=== build_errors.log content ==="
          cat build_errors.log 2>/dev/null | head -50 || echo "No build_errors.log"
          echo "=== Configuring git ==="
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          echo "=== Committing build info ==="
          git add build_full.log build_errors.log out_files.txt out_dir.txt 2>/dev/null || true
          git commit -m "Add build info for debugging" 2>&1 || echo "Nothing to commit"
          echo "=== Pushing ==="
          git push 2>&1 || echo "Push failed, trying with token"
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:master 2>&1 || echo "Push with token failed"
          echo "=== Done ==="

      - name: Upload build logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ env.DEVICE }}
          path: |
            ~/twrp/build_full.log
            ~/twrp/build_errors.log
          retention-days: 7
