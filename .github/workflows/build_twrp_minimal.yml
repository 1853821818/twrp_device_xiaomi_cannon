name: Build TWRP Minimal 12.1 for Redmi Note 9 5G (cannon)

permissions: write-all

on:
  workflow_dispatch:
    inputs:
      manifest_branch:
        description: 'TWRP Manifest Branch'
        required: true
        default: 'twrp-12.1'
      device:
        description: 'Device Codename'
        required: true
        default: 'cannon'

env:
  MANIFEST_BRANCH: ${{ github.event.inputs.manifest_branch || 'twrp-12.1' }}
  DEVICE: ${{ github.event.inputs.device || 'cannon' }}
  OEM: xiaomi
  TWRP_DEVICE: twrp_cannon

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 240

    steps:
      - name: Checkout device tree
        uses: actions/checkout@v4
        with:
          path: device/xiaomi/cannon
          persist-credentials: true
          fetch-depth: 0

      - name: Prepare build environment
        run: |
          echo "=== Installing dependencies ==="
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            git-core gnupg flex bison build-essential zip curl zlib1g-dev \
            gcc-multilib g++-multilib libc6-dev-i386 lib32ncurses5-dev \
            x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev \
            libxml2-utils xsltproc unzip fontconfig python3 python3-pip \
            libncurses5 libssl-dev libelf-dev bc cpio rsync
          echo "=== Dependencies installed ==="

      - name: Install repo tool
        run: |
          mkdir -p ~/bin
          curl -sL https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git config --global color.ui false

      - name: Initialize TWRP minimal manifest
        run: |
          export PATH=~/bin:$PATH
          mkdir -p ~/twrp
          cd ~/twrp
          echo "=== Initializing minimal TWRP manifest ==="
          repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b twrp-12.1
          echo "=== Repo initialized ==="

      - name: Sync TWRP source
        run: |
          export PATH=~/bin:$PATH
          cd ~/twrp
          echo "=== Syncing minimal TWRP source ==="
          repo sync -j$(nproc --all) --force-sync --no-clone-bundle --no-tags
          echo "=== Source synced ==="
          echo "=== Checking key files ==="
          ls -la bionic/libc/Android.bp 2>/dev/null && echo "bionic/libc/Android.bp exists"
          ls -la bootable/recovery/ 2>/dev/null | head -3
          wc -l bionic/libc/Android.bp

      - name: Copy device tree
        run: |
          echo "=== Copying device tree ==="
          mkdir -p ~/twrp/device/xiaomi
          cp -r $GITHUB_WORKSPACE/device/xiaomi/cannon ~/twrp/device/xiaomi/
          ls -la ~/twrp/device/xiaomi/cannon/
          echo "=== Device tree copied ==="

      - name: Build TWRP
        run: |
          export PATH=~/bin:$PATH
          export ALLOW_MISSING_DEPENDENCIES=true
          cd ~/twrp
          rm -f ~/twrp/build_full.log ~/twrp/build_errors.log
          echo "=== Setting up build environment ==="
          source build/envsetup.sh
          echo "=== Lunching: twrp_cannon-eng ==="
          lunch twrp_cannon-eng
          echo "=== Lunch exit code: $? ==="
          echo "=== Building recoveryimage ==="
          mka recoveryimage -j$(nproc --all) 2>&1 | tee ~/twrp/build_full.log
          BUILD_EXIT=${PIPESTATUS[0]}
          echo "=== recoveryimage exit code: $BUILD_EXIT ==="
          echo "=== Build complete ==="
          echo "=== ALL img files ==="
          find ~/twrp/out/ -name "*.img" -type f 2>/dev/null | tee ~/twrp/all_imgs.txt
          echo "=== ALL recovery files ==="
          find ~/twrp/out/ -iname "*recovery*" -type f 2>/dev/null | tee ~/twrp/all_recovery.txt
          echo "=== Device output dir ==="
          ls -la ~/twrp/out/target/product/$DEVICE/ 2>/dev/null
          echo "=== Saving error summary ==="
          grep -i -E "error:|failed|fatal:|missing|cannot|no such|ninja: build stopped" ~/twrp/build_full.log | tail -80 > ~/twrp/build_errors.log || true
          cat ~/twrp/build_errors.log
          echo "=== Build exit code: $BUILD_EXIT ==="
          exit $BUILD_EXIT

      - name: Check build output
        run: |
          echo "=== Checking build output ==="
          echo "=== All img files in out ==="
          find ~/twrp/out/ -name "*.img" -type f 2>/dev/null
          echo "=== All files in device output ==="
          ls -laR ~/twrp/out/target/product/$DEVICE/ 2>/dev/null | head -100
          echo "=== Looking for recovery ==="
          find ~/twrp/out/ -iname "*recovery*" -type f 2>/dev/null
          echo "=== Looking for boot ==="
          find ~/twrp/out/ -iname "*boot*" -type f 2>/dev/null | head -20
          RECOVERY_IMG=~/twrp/out/target/product/$DEVICE/recovery.img
          if [ -f "$RECOVERY_IMG" ]; then
            echo "=== recovery.img found ==="
            file "$RECOVERY_IMG"
            ls -lh "$RECOVERY_IMG"
          else
            echo "=== recovery.img NOT found in standard location ==="
            echo "=== Trying other locations ==="
            find ~/twrp/out/target/product/ -name "recovery*.img" -type f 2>/dev/null
            exit 1
          fi

      - name: Upload recovery image
        uses: actions/upload-artifact@v4
        with:
          name: twrp-${{ env.DEVICE }}-${{ env.MANIFEST_BRANCH }}
          path: ~/twrp/out/target/product/${{ env.DEVICE }}/recovery.img
          retention-days: 30

      - name: Save build info
        if: always()
        run: |
          echo "=== Saving build info ==="
          cd $GITHUB_WORKSPACE/device/xiaomi/cannon
          cp ~/twrp/build_full.log build_full.log 2>/dev/null || echo "No build_full.log"
          cp ~/twrp/build_errors.log build_errors.log 2>/dev/null || echo "No build_errors.log"
          cp ~/twrp/all_imgs.txt all_imgs.txt 2>/dev/null || echo "No all_imgs.txt"
          cp ~/twrp/all_recovery.txt all_recovery.txt 2>/dev/null || echo "No all_recovery.txt"
          find ~/twrp/out/target/product/$DEVICE/ -type f 2>/dev/null > out_files.txt || true
          ls -laR ~/twrp/out/target/product/$DEVICE/ 2>/dev/null > out_dir.txt || true
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add build_full.log build_errors.log out_files.txt out_dir.txt all_imgs.txt all_recovery.txt 2>/dev/null || true
          git commit -m "Add build info for debugging" 2>&1 || echo "Nothing to commit"
          git push 2>&1 || echo "Push failed"
          echo "=== Done ==="

      - name: Upload build logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ env.DEVICE }}
          path: |
            ~/twrp/build_full.log
            ~/twrp/build_errors.log
          retention-days: 7
